[package]
name = "cancao"
version = "0.1.0"
edition = "2024"
description = "Piano digital por modelagem física"
authors = ["José Damico <jose.damico@scicrop.com>"]
license = "Apache-2.0"

[[bin]]
name = "piano"
path = "src/main.rs"

[features]
default = ["audio", "gui", "partitura"]
# saída de áudio em tempo real; sem ela, só --tabela, --render e --bench
audio = ["dep:cpal"]
# piano roll em Slint (--gui)
gui = ["audio", "dep:slint", "dep:png", "dep:slint-build", "dep:rfd"]
# partitura tradicional no painel (Verovio, LGPL-3.0, compilado junto; a
# primeira compilação baixa e compila o Verovio, ~10 min)
partitura = ["gui", "dep:verovioxide", "dep:verovioxide-data", "dep:resvg", "dep:woofwoof", "dep:base64", "dep:serde_json"]

[dependencies]
cpal = { version = "0.15.3", optional = true }
rtrb = "0.3.1"
crossterm = "0.28.1"
libc = "0.2"
roxmltree = "0.20.0"
# MusicXML comprimido (.mxl)
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }
slint = { version = "1.18.1", optional = true, features = ["renderer-software"] }
png = { version = "0.17.16", optional = true }
# diálogo de abrir arquivo do sistema (no Linux, pelo xdg-desktop-portal)
rfd = { version = "0.17.2", optional = true }
verovioxide = { version = "0.3.0", optional = true }
verovioxide-data = { version = "0.3.0", optional = true }
resvg = { version = "0.48.1", optional = true }
woofwoof = { version = "1.0.2", optional = true }
base64 = { version = "0.22.1", optional = true }
serde_json = { version = "1", optional = true }

[build-dependencies]
slint-build = { version = "1.18.1", optional = true }

[profile.release]
codegen-units = 1
lto = "thin"

# os testes sintetizam áudio; sem otimização ficam lentos demais
[profile.test]
opt-level = 3
